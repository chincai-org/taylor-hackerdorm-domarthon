<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness trees</title>
    <meta name="description" content="Explore customer-support harness optimization trees." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/trees/styles.css" />
    <link rel="stylesheet" href="/trees/production.css" />
    <script src="/trees/main.js" defer></script>
    <script src="/trees/production.js" defer></script>
  </head>
  <body class="live-trees">
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/"
          ><span class="brand-mark" aria-hidden="true"></span>Harness trees</a
        >
        <nav class="topnav" aria-label="Main">
          <a href="/">Trees</a>
          <a href="/docs">API docs</a>
        </nav>
      </div>
    </header>
    <main class="container container-wide">
      <section class="section" aria-labelledby="trees-heading">
        <div class="section-head">
          <h1 id="trees-heading">Optimization trees</h1>
          <p id="tree-count" class="muted">Loading trees…</p>
        </div>
        <p id="tree-status" class="notice" role="status">Loading tree data…</p>
        <button id="tree-retry" class="detail-close" type="button" hidden>
          Retry loading trees
        </button>
        <ul id="tree-cards" class="cards" data-trees-url="/api/v1/trees" aria-live="polite"></ul>
        <noscript
          ><p class="notice">
            The live tree viewer requires JavaScript. You can still
            <a href="/api/v1/trees">read the tree data</a> or
            <a href="/docs">open the API documentation</a>.
          </p></noscript
        >
      </section>
    </main>
  </body>
</html>
