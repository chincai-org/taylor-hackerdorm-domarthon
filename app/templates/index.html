<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness trees</title>
    <meta name="description" content="Explore customer-support harness optimization trees." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/trees/styles.css" />
    <script src="/trees/main.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Harness trees</a>
        <nav class="topnav" aria-label="Main">
          <a href="/">Trees</a>
          <a href="/docs">API docs</a>
        </nav>
      </div>
    </header>
    <main class="container container-wide">
      <section class="section" aria-labelledby="trees-heading">
        <div class="section-head">
          <h1 id="trees-heading">Optimization trees</h1>
          <p id="tree-count" class="muted">Loading trees…</p>
        </div>
        <p id="tree-status" class="notice" role="status">Loading tree data…</p>
        <ul id="tree-cards" class="cards" aria-live="polite"></ul>
      </section>
      <section id="tree-detail" class="tree-detail section" hidden aria-labelledby="detail-heading"></section>
    </main>
  </body>
</html>
