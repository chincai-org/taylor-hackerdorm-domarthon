<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Sharpmon{% endblock %}</title>
    <meta
      name="description"
      content="{% block description %}Explore customer-support harness optimization trees.{% endblock %}"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/trees/theme.css" />
    <link rel="stylesheet" href="/trees/live-viewer.css" />
    <script src="/trees/live-viewer.js" defer></script>
  </head>
  <body class="live-trees">
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/"
          ><span class="brand-mark" aria-hidden="true"></span>Sharpmon</a
        >
        <nav class="topnav" aria-label="Main">
          <a href="/">Trees</a>
          <a href="/docs">API docs</a>
        </nav>
      </div>
    </header>
    <main class="container container-wide">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
