- insert:
  - id: core-logger
    name: '@cordisjs/plugin-logger'
    config:
      level: 2
      
  - id: llm-adapter
    name: '@deepseek-ai/dsh-plugin-openai'
    config:
      baseURL: 'https://llm.grafilab.ai/v1'
      apiKey: '${ENV:DEEPSEEK_API_KEY}'
      model: 'grafilab/deepseek-v4-flash'
      forceToolCalling: true
      
  - id: tool-filesystem
    name: '@deepseek-ai/dsh-plugin-fs'
    config:
      workspace: './workspace'
      
  - id: tool-search
    name: '@deepseek-ai/dsh-plugin-web-search'
