[project]
name = "customer-support-harness-optimizer"
version = "0.1.0"
description = "Hackerdorm Dormathon project template using uv + OpenAI Python SDK."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "openai>=1.51.0",
  "fastapi>=0.121.0",
  "jinja2>=3.1.4",
  "mcp>=2.3.0",
  "pydantic-settings>=2.2.1",
  "uvicorn>=0.34.0",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.6.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
